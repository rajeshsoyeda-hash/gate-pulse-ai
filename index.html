function parsePDF(txt,name){const y=+(name.match(/(?:19|20)\d\d/)||[0])[0];let body=txt,ak={};const m=[...txt.matchAll(/answer\s*key|answers\s*:/gi)].pop();

const topicOf=q=>q.ti>=0?T[q.ti]:{sub:'Other',ch:'Unclassified',topic:'Unclassified',eff:3,kind:'concept',concept:'Unclassified'};

for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(o.qs[i].year!=o.qs[j].year){const s=jac(sets[i],sets[j]);if(s>=.6){p[f(i)]=f(j);if(s>=.98)ex[i]=ex[j]=1}}
const m={};o.qs.forEach((q,i)=>(m[f(i)]=m[f(i)]||[]).push(i));
Object.values(m).forEach(ix=>{const mem=ix.map(i=>o.qs[i]),yy=[...new Set(mem.map(q=>q.year))];if(mem.length>1&&yy.length>1){const c={o,mem,yy:yy.sort(),exact:ix.some(i=>ex[i])};cl.push(c);o.rep+=mem.length;mem.forEach(q=>cmap[q.id]=c)}});
o.n=n;o.rr=o.rep/n;o.roi=n*(1+o.rr)/o.t.eff;const e=[...o.years].filter(y=>y<=mid).length,l=o.years.size-e;o.tr=l>e*1.25?'rising':l<e*.8?'falling':'steady'});

rows.forEach((r,i)=>r.bk=i>cut&&r.n<=2?'skip':r.t.kind);cl.sort((a,b)=>b.mem.length-a.mem.length);return{rows,N,cut,cl,cmap}}

<div class="card"><h2>ROI ranking</h2><div class="tw"><table><tr><th>#</th><th>Topic</th><th>Subject</th><th>Qs</th><th>Repeat</th><th>Effort</th><th>ROI</th><th>Bucket</th></tr>${sh2.map((r,i)=>`<tr><td>${rows.indexOf(r)+1}</td><td>${esc(r.t.topic)}</td><td>${r.t.sub}</td><td>${r.n}</td><td>${(r.rr*100).toFixed(0)}%</td><td>${r.t.eff}/5</td><td><b>${r.roi.toFixed(1)}</b></td><td>${bkb(r.bk)}</td></tr>`).join('')}</table></div><div class="row"><button class="btn ghost" data-a="all">${ALL?'Show top 15':'Show all '+rows.length+' topics'}</button></div></div>`},
()=>`<h1>PDF upload & parser</h1><p class="mut">Questions, tags and answer keys are read in your browser. Nothing is uploaded.</p>
<label class="drop" id="dz"><input type="file" id="fi" accept=".pdf,application/pdf" multiple hidden><b>Drop PYQ PDFs here, or click to choose several</b><span class="mut">Put the year in the file name (for example GATE-2019.pdf) so repeats can be matched across years.</span></label>
<div class="row"><button class="btn" data-a="sample">Load sample GATE dataset (1987–2025)</button><button class="btn ghost" data-a="paste">Paste PYQ text</button><button class="btn ghost" data-a="clear">Clear all data</button></div>
<p class="mut">The sample is generated from template questions for demonstration. It is not official paper text.</p>
${S.files.length?`<div class="card tw"><table><tr><th>File</th><th>Size</th><th>Pages</th><th>Questions</th><th>Progress</th><th></th></tr>${S.files.map((f,i)=>`<tr><td>${esc(f.name)}${f.warn?`<div class="warnb">${esc(f.warn)}</div>`:''}</td><td>${f.size?(f.size/1024).toFixed(0)+' KB':'—'}</td><td>${f.pages}</td><td>${f.n}</td><td><div class="pbar"><div id="pb${i}" style="width:${f.pct}%"></div></div></td><td><button class="btn ghost" data-a="del" data-n="${esc(f.name)}">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="card mut">No files yet. Drop a PDF or load the sample dataset.</div>'}`,
()=>{const subs=[...new Set(A.rows.map(r=>r.t.sub))],rs=A.rows.filter(r=>!SUB||r.t.sub==SUB),ch=new Map();rs.forEach(r=>{const k=r.t.sub+' › '+r.t.ch;(ch.get(k)||ch.set(k,[]).get(k)).push(r)});
return `<h1>Chapter & topic weightage</h1>${heat()}<div class="row">${['',...subs].map(s=>`<button class="chip ${SUB==s?'on':''}" data-a="subj" data-s="${esc(s)}">${s||'All subjects'}</button>`).join('')}</div>`+
[...ch].sort((a,b)=>b[1].reduce((x,r)=>x+r.n,0)-a[1].reduce((x,r)=>x+r.n,0)).map(([k,v])=>{const n=v.reduce((x,r)=>x+r.n,0);return `<details><summary>${esc(k)} <span class="mut">· ${n} questions · ${(n/A.N*100).toFixed(1)}%</span></summary><div class="tw"><table><tr><th>Topic</th><th>Qs</th><th>Share</th><th>Years</th><th>Trend</th></tr>${v.map(r=>`<tr><td>${esc(r.t.topic)}</td><td>${r.n}</td><td>${(r.n/A.N*100).toFixed(1)}%</td><td>${yb(r.years)}</td><td><span class="bg ${r.tr=='rising'?'quick':r.tr=='falling'?'practice':'skip'}">${r.tr}</span></td></tr>`).join('')}</table></div></details>`}).join('')},
()=>`<h1>Repeat & concept radar</h1><p class="mut">Questions that return in different years are grouped by the concept behind them. Numbers are ignored when comparing, so tweaked values still match.</p><p><b>${A.cl.length}</b> repeat clusters found.</p>`+(A.cl.slice(0,40).map(c=>{const k=c.o.t.kind;return `<details><summary>${esc(c.o.t.concept)} <span class="bg ${c.exact?'quick':'concept'}">${c.exact?'numbers tweaked':'reworded'}</span><span class="mut"> · appeared ${c.mem.length}× in ${c.yy.length} years</span></summary><div><p>${yb(c.yy)}</p><p><b>Typical twist:</b> ${TT[c.o.t.topic]||TRAP[k]}</p><p class="mut">${esc(c.o.t.sub)} › ${esc(c.o.t.topic)}</p>${c.mem.slice(0,12).map(q=>`<div class="q" data-a="q" data-id="${esc(q.id)}"><b>${q.year||'?'}</b> ${esc(q.text.slice(0,140))}</div>`).join('')}</div></details>`}).join('')||'<div class="card mut">No repeats found yet. Add more years of papers.</div>'),
()=>{const by={practice:[],concept:[],quick:[],skip:[]};A.rows.forEach(r=>by[r.bk].push(r));
return `<h1>Study strategy</h1><div class="row"><button class="btn" data-a="exp">Export study plan</button></div>`+Object.keys(by).map(k=>`<div class="card"><h2 class="${k}">${BN[k]} <span class="mut">(${by[k].length} topics)</span></h2><p class="mut">${PX[k]}</p>${by[k].map(r=>`<details><summary>${esc(r.t.topic)} <span class="mut">· ${r.n} Qs · ${(r.rr*100).toFixed(0)}% repeat · done <span data-prog="${esc(r.t.topic)}">${done(r)}/${r.n}</span></span></summary><div><textarea data-note="${esc(r.t.topic)}" placeholder="Your notes for this topic" aria-label="Notes">${esc(S.notes[r.t.topic]||'')}</textarea><p class="mut">PYQ checklist (latest ${Math.min(r.n,25)})</p>${[...r.qs].sort((a,b)=>b.year-a.year).slice(0,25).map(q=>`<label class="q" style="display:block;cursor:default"><input type="checkbox" data-chk="${esc(q.id)}" data-t="${esc(r.t.topic)}" ${S.checks[q.id]?'checked':''}> <b>${q.year||'?'}</b> ${esc(q.text.slice(0,110))}</label>`).join('')}</div></details>`).join('')||'<span class="mut">Nothing here.</span>'}</div>`).join('')},
()=>{const subs=[...new Set(A.rows.map(r=>r.t.sub))],tps=A.rows.filter(r=>!E.sub||r.t.sub==E.sub).map(r=>r.t.topic);
return `<h1>Question bank</h1><div class="row"><input id="fq" type="search" placeholder="Search questions" value="${esc(E.q)}" aria-label="Search"><select id="fs"><option value="">All subjects</option>${subs.map(s=>`<option ${E.sub==s?'selected':''}>${s}</option>`).join('')}</select><select id="ft"><option value="">All topics</option>${tps.map(s=>`<option ${E.topic==s?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="fy"><option value="">All types</option>${['MCQ','MSQ','NAT','Subjective'].map(s=>`<option ${E.type==s?'selected':''}>${s}</option>`).join('')}</select><label><input type="checkbox" id="fr" ${E.rep?'checked':''}> Repeated only</label></div><div class="card" id="res"></div>`}];
function fq(){const q=E.q.toLowerCase(),r=S.qs.filter(x=>{const t=topicOf(x);return(!q||x.text.toLowerCase().includes(q))&&(!E.sub||t.sub==E.sub)&&(!E.topic||t.topic==E.topic)&&(!E.type||x.type==E.type)&&(!E.rep||A.cmap[x.id])});
$('#res').innerHTML=`<p class="mut">${r.length} questions${r.length>100?' (showing 100)':''}</p>`+r.slice(0,100).map(x=>`<div class="q" data-a="q" data-id="${esc(x.id)}"><span class="bg pri">${x.type}</span><b>${x.year||'?'}</b> ${A.cmap[x.id]?'<span class="bg concept">repeated</span>':''} ${esc(x.text.slice(0,170))}</div>`).join('')}
function draw(){const r=A.rows.slice(0,20);Chart.defaults.color='#94a3b8';chart=new Chart($('#pc'),{data:{labels:r.map(x=>x.t.topic.slice(0,16)),datasets:[{type:'bar',label:'Questions',data:r.map(x=>x.n),backgroundColor:r.map((x,i)=>i<=tcut()?'#10B981':'#6366F1')},{type:'line',label:'Cumulative %',data:r.map(x=>+x.cum.toFixed(1)),borderColor:'#F59E0B',yAxisID:'y1',tension:.3}]},options:{responsive:true,maintainAspectRatio:false,scales:{y1:{position:'right',min:0,max:100,grid:{drawOnChartArea:false}}}}});const sb=[...new Set(A.rows.map(r=>r.t.sub))];chart.d2=new Chart($('#dn'),{type:'doughnut',data:{labels:sb,datasets:[{data:sb.map(s=>A.rows.filter(r=>r.t.sub==s).reduce((a,r)=>a+r.n,0)),backgroundColor:['#6366F1','#8B5CF6','#EC4899','#10B981','#14B8A6','#F59E0B','#F97316','#06B6D4','#3B82F6','#A855F7','#84CC16','#EAB308']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}})}
let TG=65;const tcut=()=>{const p=(TG-10)/85*100,i=A.rows.findIndex(r=>r.cum>=p);return i<0?A.rows.length-1:i};
const TT={"Recurrences & Master Theorem":"T(n)=T(n-1)+n gives n²/2, and an n log n driving term sits between master-theorem cases.","QuickSort & Sorting Worst Cases":"Sorted and reverse-sorted input are both worst cases with an end pivot.","Shortest Paths & MST":"Dijkstra fails with negative edges. Adding a constant to every edge keeps the MST but can change shortest paths.","Binary Trees & Traversals":"Pre+In (or Post+In) fixes any binary tree. Pre+Post fixes only a full binary tree.","Linked Lists & Hashing":"Check whether the head or tail pointer is given before counting pointer changes.","Undecidability & Reductions":"Rice’s theorem covers non-trivial semantic properties only, not syntactic ones.","CFG, PDA & Ambiguity":"Ambiguity of an arbitrary CFG is undecidable, and some CFLs are inherently ambiguous.","Paging & Virtual Memory":"Belady’s anomaly appears in FIFO, not in LRU or optimal replacement.","Deadlock & Synchronization":"The critical section is the code touching shared data, not the P/V calls around it.","Functional Dependencies & Normal Forms":"X→Y only forces equal Y for equal X, so (1,2) and (2,2) are allowed. Always compute closures.","IEEE-754 & Number Representation":"Excess-N makes the smallest exponent all zeros, so magnitudes compare like unsigned integers.","CPU Scheduling":"Draw the Gantt chart and re-check arrivals at every preemption point.","Combinatorics & Generating Functions":"Check whether the sequence starts at F₀ or F₁ before writing G(z).","Transactions, Indexing & B+ Trees":"A cycle in the precedence graph means the schedule is not conflict serializable."};
const P=t=>S.pr[t]||{st:0,n:0,c:2},setP=(t,o)=>{S.pr[t]={...P(t),...o};save()},ST=['Not started','Concept revised','PYQs mastered'];
function heat(){const ys=[...new Set(S.qs.map(q=>q.year).filter(Boolean))].sort(),sb=[...new Set(A.rows.map(r=>r.t.sub))];if(!ys.length)return'';const c={};S.qs.forEach(q=>{const k=topicOf(q).sub+'|'+q.year;c[k]=(c[k]||0)+1});const mx=Math.max(...Object.values(c));return `<div class="card tw"><h2>Year-by-year heatmap</h2><table><tr><th>Subject</th>${ys.map(y=>`<th>${String(y).slice(2)}</th>`).join('')}</tr>${sb.map(s=>`<tr><td>${s}</td>${ys.map(y=>{const v=c[s+'|'+y]||0;return `<td style="text-align:center;background:rgba(99,102,241,${v?.15+.85*v/mx:0});padding:4px 6px">${v||''}</td>`}).join('')}</tr>`).join('')}</table><p class="mut">Columns are exam years (last two digits). Darker cells mean more questions.</p></div>`}
function csv(){return'Rank,Topic,Subject,Questions,Repeat %,ROI,Bucket,Stage,Solved,Confidence\n'+A.rows.map((r,i)=>[i+1,'"'+r.t.topic+'"',r.t.sub,r.n,(r.rr*100).toFixed(0),r.roi.toFixed(1),r.bk,ST[P(r.t.topic).st],P(r.t.topic).n,P(r.t.topic).c].join(',')).join('\n')}
function pasteImp(){const ti=$('#pt').value||'Pasted set',y=$('#py').value||'2025',tx=$('#px').value,name=y+' '+ti+'.txt';let qs=parsePDF(tx,name);if(!qs.length)qs=tx.split(/\n\s*\n/).map(b=>b.trim()).filter(b=>b.length>25).map((b,i)=>({id:name+'#'+i,year:+y||0,src:name,text:b.slice(0,700),type:qtype(b),ans:'Not found',ti:T.findIndex(k=>k.kw.test(b))}));if(!qs.length){toast('No questions found. Use Q1., Q2. markers or blank lines between questions.');return}delFile(name);S.qs.push(...qs);S.files.push({name,size:0,pages:1,n:qs.length,pct:100});save();$('#modal').hidden=true;toast('Imported '+qs.length+' questions');render()}
V.push(()=>{const rs=A.rows,N=A.N,rd=rs.reduce((a,r)=>a+r.n*[0,.55,1][P(r.t.topic).st],0)/N,tech=rd*85,days=[...Array(14)].map((_,i)=>{const d=new Date(Date.now()-(13-i)*864e5).toISOString().slice(0,10);return{d,...(S.log[d]||{n:0,h:0})}}),mx=Math.max(10,...days.map(d=>d.n));let i=13,sk=0;if(!days[13].n&&!days[13].h)i=12;while(i>=0&&(days[i].n||days[i].h)){sk++;i--}const m=rs.filter(r=>P(r.t.topic).st==2).length,v=rs.filter(r=>P(r.t.topic).st==1).length,hs=days.reduce((a,d)=>a+d.h,0),ps=days.reduce((a,d)=>a+d.n,0);
return `<h1>Progress & readiness</h1><p class="mut">Readiness weights each topic by its share of questions: mastered counts fully, revised counts 55%. The mark estimate is a rough guide (85 technical marks plus an assumed 11.5 in aptitude), not a prediction.</p><div class="grid">${kpi('Readiness',(rd*100).toFixed(0)+'%','weighted by question share')}${kpi('Estimated score','~'+(tech+11.5).toFixed(0)+' / 100','technical '+tech.toFixed(0)+' / 85')}${kpi('Topic pipeline',m+' mastered',v+' revised, '+(rs.length-m-v)+' pending')}${kpi('Study streak',sk+' days',ps+' PYQs, '+hs.toFixed(1)+' h in 14 days')}</div><div class="card"><h2>Last 14 days</h2><div style="display:flex;align-items:flex-end;gap:5px;height:130px">${days.map(d=>`<div title="${d.d}: ${d.n} PYQs, ${d.h} h" style="flex:1;text-align:center;font-size:11px"><div style="height:${Math.round(d.n/mx*90)}px;min-height:3px;background:var(--ok);border-radius:4px 4px 0 0"></div>${d.n}</div>`).join('')}</div><div class="row"><label>PYQs solved <input type="number" id="lsn" min="0" value="5" style="width:80px"></label><label>Hours <input type="number" id="lsh" min="0" step="0.5" value="1.5" style="width:80px"></label><button class="btn" data-a="log">Add to today</button></div></div><div class="card tw"><h2>Topic tracker</h2><table><tr><th>Topic</th><th>Stage</th><th>Solved</th><th>Confidence</th></tr>${rs.map(r=>{const p=P(r.t.topic),t=esc(r.t.topic);return `<tr><td>${t}<div class="mut">${r.n} PYQs</div></td><td><select data-st="${t}" aria-label="Stage">${ST.map((s,j)=>`<option value="${j}" ${p.st==j?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="chip" data-a="sn" data-t="${t}" data-d="-1" aria-label="Fewer">−</button> <b>${p.n}</b> <button class="chip" data-a="sn" data-t="${t}" data-d="1" aria-label="More">+</button></td><td>${[1,2,3,4,5].map(k=>`<button class="chip ${k<=p.c?'on':''}" data-a="cf" data-t="${t}" data-v="${k}" aria-label="${k} of 5">${k}</button>`).join(' ')}</td></tr>`}).join('')}</table></div>`});
const NAV=['Overview & Pareto 80/20','PDF upload & parser','Chapter & topic weightage','Repeat & concept radar','Study strategy','Question bank','Progress & readiness'];
$('#nav').innerHTML=NAV.map((n,i)=>`<button data-a="tab" data-i="${i}">${n}</button>`).join('');
function render(){A=analyze();document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',i==S.tab));if(chart){chart.d2&&chart.d2.destroy();chart.destroy();chart=null}
if(!S.qs.length&&S.tab!=1){$('#main').innerHTML=`<h1>${NAV[S.tab]}</h1><div class="card"><p>No questions to analyse yet. Upload PYQ PDFs, or explore every chart with the sample dataset.</p><button class="btn" data-a="sample">Load sample GATE dataset (1987–2025)</button></div>`;return}
$('#main').innerHTML=V[S.tab]();if(S.tab==0)draw();if(S.tab==5)fq()}
function md(){let s=`# GATE Pulse study plan\n\n${A.N} questions analysed. The first ${A.cut+1} topics cover ${A.rows[A.cut].cum.toFixed(0)}% of them.\n`;Object.keys(BN).forEach(k=>{const r=A.rows.filter(x=>x.bk==k);s+=`\n## ${BN[k]}\n_${PX[k]}_\n\n`+r.map(x=>`- [${done(x)==x.n?'x':' '}] **${x.t.topic}** (${x.t.sub}): ${x.n} PYQs, ${(x.rr*100).toFixed(0)}% repeat, ROI ${x.roi.toFixed(1)}, practised ${done(x)}/${x.n}${S.notes[x.t.topic]?'\n  - Notes: '+S.notes[x.t.topic].replace(/\n/g,' '):''}`).join('\n')+'\n'});return s}
function openM(h){$('#mc').innerHTML=h;$('#modal').hidden=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(e.target.id=='modal')$('#modal').hidden=true;if(!b)return;const d=b.dataset;switch(d.a){
case'tab':S.tab=+d.i;save();render();break;case'sample':loadSample();break;
case'clear':if(confirm('Delete all uploaded data, notes and checklists?')){S.qs=[];S.files=[];S.checks={};S.notes={};save();render()}break;
case'del':delFile(d.n);save();render();break;case'subj':SUB=d.s;render();break;case'all':ALL=!ALL;render();break;
case'exp':openM(`<h2>Study plan (Markdown)</h2><textarea id="mt" style="height:320px" readonly>${esc(md())}</textarea><div class="row"><button class="btn" data-a="copy">Copy Markdown</button><button class="btn ghost" data-a="csv">Copy topic table (CSV)</button><button class="btn ghost" data-a="print">Print / save as PDF</button><button class="btn ghost" data-a="close">Close</button></div>`);break;
case'copy':{const t=$('#mt');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'))}catch(x){document.execCommand('copy')}toast('Copied to clipboard');break}
case'print':window.print();break;
case'log':{const k=new Date().toISOString().slice(0,10),o=S.log[k]||{n:0,h:0};S.log[k]={n:o.n+(+$('#lsn').value||0),h:o.h+(+$('#lsh').value||0)};save();toast('Added to today');render();break}
case'sn':setP(d.t,{n:Math.max(0,P(d.t).n+ +d.d)});render();break;
case'cf':setP(d.t,{c:+d.v});render();break;
case'pimp':pasteImp();break;
case'csv':{try{navigator.clipboard.writeText(csv())}catch(x){}const t=document.createElement('textarea');t.value=csv();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('CSV copied');break}
case'paste':openM(`<h2>Paste PYQ text</h2><div class="row"><input id="pt" value="Custom PYQ set" aria-label="Title"><input id="py" value="2025" style="width:90px" aria-label="Year"></div><textarea id="px" style="height:200px" placeholder="Q1. First question...&#10;Q2. Second question...&#10;Answer Key: 1. A 2. C" aria-label="Questions"></textarea><div class="row"><button class="btn" data-a="pimp">Parse and map</button><button class="btn ghost" data-a="close">Cancel</button></div>`);break;case'close':$('#modal').hidden=true;break;
case'q':{const q=S.qs.find(x=>x.id==d.id),t=topicOf(q),c=A.cmap[q.id];openM(`<h2>${q.year||'Unknown year'} · ${esc(q.src)}</h2><p>${esc(q.text)}</p><p><span class="bg pri">${q.type}</span><span class="bg skip">${t.sub} › ${esc(t.topic)}</span>${c?'<span class="bg concept">recurring concept</span>':''}</p><p><b>Answer key:</b> ${esc(q.ans)}</p><p><b>Concept:</b> ${esc(t.concept)}${c?`<br><span class="mut">Also appeared in: ${c.yy.join(', ')}</span>`:''}</p><label><input type="checkbox" data-chk="${esc(q.id)}" data-t="${esc(t.topic)}" ${S.checks[q.id]?'checked':''}> Mark as practised</label><div class="row"><button class="btn" data-a="close">Close</button></div>`)}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.chk){S.checks[t.dataset.chk]=t.checked;if(!t.checked)delete S.checks[t.dataset.chk];save();const r=A.rows.find(x=>x.t.topic==t.dataset.t),p=document.querySelector(`[data-prog="${CSS.escape(t.dataset.t)}"]`);if(r&&p)p.textContent=done(r)+'/'+r.n}
if(t.id=='fi'){handle([...t.files]);t.value=''}
if(t.id=='tg'){TG=+t.value;render()}if(t.dataset.st!=null){setP(t.dataset.st,{st:+t.value});render()}
if(t.id=='fs'){E.sub=t.value;E.topic='';render()}if(t.id=='ft'){E.topic=t.value;fq()}if(t.id=='fy'){E.type=t.value;fq()}if(t.id=='fr'){E.rep=t.checked;fq()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.note!=null){S.notes[t.dataset.note]=t.value;save()}if(t.id=='fq'){E.q=t.value;fq()}});
['dragover','dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{const z=e.target.closest&&e.target.closest('#dz');if(!z)return;e.preventDefault();z.classList.toggle('ov',n=='dragover');if(n=='drop')handle([...e.dataTransfer.files])}));
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('#modal').hidden=true});
render();
